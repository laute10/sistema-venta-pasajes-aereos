# ============================================================
#  Configuración del Sistema de Venta de Pasajes Aéreos
#
#  1. Copiá este archivo y renombralo a: config.properties
#  2. Completá tus datos.
#
#  config.properties está en .gitignore: nunca se sube a GitHub.
# ============================================================

# --- Base de datos MySQL ---
db.url=jdbc:mysql://localhost:3306/venta_pasajes
db.usuario=root
db.password=TU_CONTRASEÑA_DE_MYSQL

# --- Envío de correos con Gmail (opcional) ---
# Si dejás estos dos campos vacíos, la aplicación funciona igual,
# pero no envía los correos de confirmación.
# La contraseña NO es la de tu Gmail: es una "contraseña de aplicación"
# (ver la sección "Correos con Gmail" del README).
email.origen=
email.contrasena=
